<script>

/* =========================
   AI CHAT
========================= */

async function askAI(){

const question =
document.getElementById("question").value.trim();

const answer =
document.getElementById("answer");

const button =
document.getElementById("sendButton");

if(!question){

answer.textContent =
"Please type a question.";

return;
}

answer.textContent =
"Thinking... 🤖";

button.disabled=true;

try{

const response =
await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error || "Something went wrong."
);

}

answer.textContent =
"B1S2W AI:\n\n"+
data.answer;

}catch(error){

answer.textContent =
"B1S2W AI:\n\nError: "+
error.message;

}finally{

button.disabled=false;

}

}


/* =========================
   VIDEO PREVIEW
========================= */

function previewVideo(){

const file =
document.getElementById("videoFile").files[0];

const video =
document.getElementById("videoPreview");

if(!file){

video.style.display="none";

return;

}

const url =
URL.createObjectURL(file);

video.src=url;

video.style.display="block";

}


/* =========================
   CONVERT FILE TO BASE64
========================= */

function fileToBase64(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{

const result=reader.result;

const base64=
result.split(",")[1];

resolve(base64);

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* =========================
   VIDEO TRANSLATOR
========================= */

async function translateVideo(){

const file =
document.getElementById("videoFile").files[0];

const original =
document.getElementById("originalLanguage").value;

const target =
document.getElementById("targetLanguage").value;

const status =
document.getElementById("videoStatus");

const button =
document.getElementById("translateButton");

const results =
document.getElementById("translationResults");


if(!file){

status.textContent=
"❌ আগে একটি ভিডিও Upload করো।";

return;

}


if(original===target){

status.textContent=
"❌ Original Language এবং Translate To একই হতে পারবে না।";

return;

}


button.disabled=true;

results.innerHTML="";

status.textContent=
"⏳ Video প্রস্তুত করা হচ্ছে...\n\nএতে কিছু সময় লাগতে পারে।";


try{

const base64=
await fileToBase64(file);


status.textContent=
"⏳ Video AI-তে পাঠানো হচ্ছে...\n\nদয়া করে অপেক্ষা করো।";


const response=
await fetch("/api/translate-video",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

videoBase64:base64,

mimeType:file.type,

originalLanguage:original,

targetLanguage:target

})

});


const data=
await response.json();


if(!response.ok){

throw new Error(
typeof data.error==="string"
? data.error
: JSON.stringify(data.error)
);

}


results.innerHTML=`

<div class="result-box">

<div class="detected">
✅ Video translation complete!
</div>

<p>
<b>Detected Language:</b>
${escapeHTML(data.detectedLanguage || "Unknown")}
</p>

</div>


<div class="result-box">

<div class="result-title">
📝 Original Transcript
</div>

<textarea readonly>${escapeHTML(
data.transcript || ""
)}</textarea>

</div>


<div class="result-box">

<div class="result-title">
🌐 Translation
</div>

<textarea readonly>${escapeHTML(
data.translation || ""
)}</textarea>

</div>

`;


status.textContent=
"✅ Translation সফলভাবে সম্পন্ন হয়েছে।";


}catch(error){

status.textContent=
"❌ Error:\n"+
error.message;

}finally{

button.disabled=false;

}

}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>
