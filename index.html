<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:850px;
  margin:25px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
  font-size:32px;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

input[type="file"]{
  padding:10px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.answer,
.status{
  margin-top:18px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:60px;
  white-space:pre-wrap;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}

.small{
  color:#9ca3af;
  font-size:14px;
  margin-top:10px;
}

.success{
  color:#00ff99;
}

.error{
  color:#ff6b6b;
}

@media(max-width:600px){
  .language-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 B1S2W AI</h1>
    <p>AI Assistant & Video Language Converter</p>
  </div>


  <!-- AI CHAT -->

  <div class="card">

    <h2>💬 AI Chat</h2>

    <input
      id="question"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="askAI()"
    >
      Send
    </button>

    <div
      id="answer"
      class="answer"
    ></div>

  </div>


  <!-- VIDEO TRANSLATOR -->

  <div class="card">

    <h2>🎬 Video Language Converter</h2>

    <p class="small">
      Upload a video and translate the spoken dialogue.
    </p>

    <input
      id="videoFile"
      type="file"
      accept="video/*"
      onchange="previewVideo()"
    >

    <p class="small">
      ছোট ভিডিও দিয়ে প্রথমে পরীক্ষা করো।
    </p>

    <video
      id="videoPreview"
      class="video-preview"
      controls
    ></video>


    <div class="language-grid">

      <div>

        <label>Original Language</label>

        <select id="originalLanguage">

          <option value="auto">
            Auto Detect
          </option>

          <option value="bengali">
            বাংলা
          </option>

          <option value="hindi">
            हिन्दी
          </option>

          <option value="english">
            English
          </option>

        </select>

      </div>


      <div>

        <label>Translate To</label>

        <select id="targetLanguage">

          <option value="bengali">
            বাংলা
          </option>

          <option value="hindi">
            हिन्दी
          </option>

          <option value="english">
            English
          </option>

        </select>

      </div>

    </div>


    <button
      id="translateButton"
      onclick="translateVideo()"
    >
      🌐 Translate Video
    </button>


    <div
      id="videoStatus"
      class="status"
    ></div>


    <h3 style="margin-top:25px;">
      📝 Original Transcript
    </h3>

    <textarea
      id="transcript"
      readonly
      placeholder="Original spoken dialogue will appear here..."
    ></textarea>


    <h3 style="margin-top:25px;">
      🌐 Translation
    </h3>

    <textarea
      id="translation"
      readonly
      placeholder="Translated dialogue will appear here..."
    ></textarea>

  </div>

</div>


<script>

/* ================================
   AI CHAT
================================ */

async function askAI(){

  const question =
    document.getElementById("question")
    .value.trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");


  if(!question){

    answer.textContent =
      "Please type a question.";

    return;
  }


  answer.textContent =
    "Thinking... 🤖";

  button.disabled = true;


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          question:question
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      const message =
        typeof data.error === "string"
          ? data.error
          : JSON.stringify(data.error,null,2);

      throw new Error(
        message ||
        "Something went wrong."
      );
    }


    answer.textContent =
      "B1S2W AI:\n\n" +
      (data.answer || "No answer returned.");


  }catch(error){

    answer.textContent =
      "B1S2W AI:\n\n❌ Error:\n" +
      error.message;

  }finally{

    button.disabled = false;

  }

}


/* ================================
   VIDEO PREVIEW
================================ */

function previewVideo(){

  const file =
    document.getElementById("videoFile")
    .files[0];

  const video =
    document.getElementById("videoPreview");


  if(!file){

    video.style.display = "none";

    return;
  }


  const oldUrl =
    video.dataset.url;

  if(oldUrl){
    URL.revokeObjectURL(oldUrl);
  }


  const url =
    URL.createObjectURL(file);

  video.dataset.url = url;

  video.src = url;

  video.style.display = "block";

}


/* ================================
   VIDEO TRANSLATOR
================================ */

async function translateVideo(){

  const file =
    document.getElementById("videoFile")
    .files[0];

  const original =
    document.getElementById("originalLanguage")
    .value;

  const target =
    document.getElementById("targetLanguage")
    .value;

  const status =
    document.getElementById("videoStatus");

  const transcript =
    document.getElementById("transcript");

  const translation =
    document.getElementById("translation");

  const button =
    document.getElementById("translateButton");


  if(!file){

    status.innerHTML =
      '<span class="error">❌ আগে একটি ভিডিও Upload করো।</span>';

    return;
  }


  if(original === target){

    status.innerHTML =
      '<span class="error">❌ Original language এবং Target language একই হতে পারবে না।</span>';

    return;
  }


  /*
    Browser থেকে সরাসরি পুরো ভিডিও
    Base64 হিসেবে backend-এ পাঠানো হবে।
  */

  button.disabled = true;

  transcript.value = "";
  translation.value = "";


  status.textContent =
    "⏳ Video AI-কে পাঠানো হচ্ছে...\n\n" +
    "এতে কিছু সময় লাগতে পারে।";


  try{

    const videoBase64 =
      await fileToBase64(file);


    const response =
      await fetch("/api/translate-video",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          videoBase64:videoBase64,

          mimeType:file.type,

          originalLanguage:original,

          targetLanguage:target

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      const errorMessage =
        typeof data.error === "string"
          ? data.error
          : JSON.stringify(data.error,null,2);

      throw new Error(
        errorMessage ||
        "Video translation failed."
      );
    }


    /*
      Backend থেকে আসা result
    */

    transcript.value =
      data.transcript || "";


    translation.value =
      data.translation || "";


    status.innerHTML =
      '<span class="success">✅ Video translation complete!</span>\n\n' +

      "Detected Language: " +
      (data.detectedLanguage || "Unknown");


  }catch(error){

    status.innerHTML =
      '<span class="error">❌ Error:</span>\n\n' +
      error.message;

  }finally{

    button.disabled = false;

  }

}


/* ================================
   FILE → BASE64
================================ */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();


    reader.onload = () => {

      const result =
        reader.result;


      /*
        data:video/mp4;base64,...
        থেকে শুধু Base64 অংশ নেওয়া হচ্ছে।
      */

      const base64 =
        result.split(",")[1];


      resolve(base64);

    };


    reader.onerror = () => {

      reject(
        new Error(
          "ভিডিও পড়তে সমস্যা হয়েছে।"
        )
      );

    };


    reader.readAsDataURL(file);

  });

}

</script>

</body>
      </html>
