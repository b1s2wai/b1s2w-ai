<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:900px;
  margin:25px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}

.status{
  margin-top:15px;
  color:#9ca3af;
  white-space:pre-wrap;
}

.dialogue-card{
  background:#0f172a;
  border:1px solid #374151;
  border-radius:14px;
  padding:16px;
  margin-top:15px;
}

.dialogue-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.speaker{
  color:#00ff99;
  font-size:18px;
  font-weight:bold;
}

.time{
  color:#fbbf24;
}

.field{
  margin-top:12px;
}

.field label{
  display:block;
  margin-top:5px;
  color:#9ca3af;
  font-size:13px;
}

.small-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.voice-box{
  margin-top:15px;
  padding:12px;
  border:1px solid #374151;
  border-radius:12px;
  background:#111827;
}

.voice-box label{
  display:block;
  color:#00ff99;
  font-weight:bold;
}

.edit-button{
  background:#2563eb;
}

.save-button{
  background:#9333ea;
}

.empty{
  color:#9ca3af;
  text-align:center;
  padding:20px;
}

@media(max-width:600px){
  .language-grid,
  .small-grid{
    grid-template-columns:1fr;
  }

  .dialogue-header{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🤖 B1S2W AI</h1>
<p>🎬 AI Video Language Converter & Multi-Character Dialogue</p>
</div>

<div class="card">

<h2>🎬 Video Language Converter</h2>

<p style="color:#9ca3af">
ভিডিও Upload করো এবং সব Character-এর dialogue আলাদা করে translation তৈরি করো।
</p>

<input
id="videoFile"
type="file"
accept="video/*"
onchange="previewVideo()"
>

<video
id="videoPreview"
class="video-preview"
controls
></video>

<div class="language-grid">

<div>

<label>Original Language</label>

<select id="originalLanguage">
<option value="auto">🌐 Auto Detect</option>
<option value="bengali">🇧🇩 বাংলা</option>
<option value="hindi">🇮🇳 हिन्दी</option>
<option value="english">🇺🇸 English</option>
<option value="japanese">🇯🇵 日本語</option>
<option value="korean">🇰🇷 한국어</option>
<option value="chinese">🇨🇳 中文</option>
<option value="spanish">🇪🇸 Español</option>
<option value="french">🇫🇷 Français</option>
<option value="german">🇩🇪 Deutsch</option>
<option value="arabic">🇸🇦 العربية</option>
<option value="portuguese">🇵🇹 Português</option>
<option value="russian">🇷🇺 Русский</option>
<option value="italian">🇮🇹 Italiano</option>
<option value="turkish">🇹🇷 Türkçe</option>
<option value="vietnamese">🇻🇳 Tiếng Việt</option>
<option value="thai">🇹🇭 ไทย</option>
<option value="indonesian">🇮🇩 Bahasa Indonesia</option>
<option value="urdu">🇵🇰 اردو</option>
<option value="tamil">🇮🇳 தமிழ்</option>
<option value="telugu">🇮🇳 తెలుగు</option>
<option value="marathi">🇮🇳 मराठी</option>
<option value="gujarati">🇮🇳 ગુજરાતી</option>
<option value="punjabi">🇮🇳 ਪੰਜਾਬী</option>
<option value="malayalam">🇮🇳 മലയാളം</option>
<option value="nepali">🇳🇵 नेपाली</option>
</select>

</div>

<div>

<label>Translate To</label>

<select id="targetLanguage">
<option value="bengali">🇧🇩 বাংলা</option>
<option value="hindi">🇮🇳 हिन्दी</option>
<option value="english">🇺🇸 English</option>
<option value="japanese">🇯🇵 日本語</option>
<option value="korean">🇰🇷 한국어</option>
<option value="chinese">🇨🇳 中文</option>
<option value="spanish">🇪🇸 Español</option>
<option value="french">🇫🇷 Français</option>
<option value="german">🇩🇪 Deutsch</option>
<option value="arabic">🇸🇦 العربية</option>
<option value="portuguese">🇵🇹 Português</option>
<option value="russian">🇷🇺 Русский</option>
<option value="italian">🇮🇹 Italiano</option>
<option value="turkish">🇹🇷 Türkçe</option>
<option value="vietnamese">🇻🇳 Tiếng Việt</option>
<option value="thai">🇹🇭 ไทย</option>
<option value="indonesian">🇮🇩 Bahasa Indonesia</option>
<option value="urdu">🇵🇰 اردو</option>
<option value="tamil">🇮🇳 தமிழ்</option>
<option value="telugu">🇮🇳 తెలుగు</option>
<option value="marathi">🇮🇳 मराठी</option>
<option value="gujarati">🇮🇳 ગુજરાતી</option>
<option value="punjabi">🇮🇳 ਪੰਜਾਬী</option>
<option value="malayalam">🇮🇳 മലയാളം</option>
<option value="nepali">🇳🇵 नेपाली</option>
</select>

</div>

</div>

<button
id="translateButton"
onclick="translateVideo()"
>
🌐 Analyze & Translate Video
</button>

<div id="videoStatus" class="status"></div>

</div>


<div
id="timelineCard"
class="card"
style="display:none"
>

<h2>🎬 Dialogue Timeline</h2>

<div id="detectedLanguage"></div>

<div id="dialogueTimeline"></div>

</div>

</div>


<script>

let dialogueData=[];


/* VIDEO PREVIEW */

function previewVideo(){

const file=
document.getElementById("videoFile").files[0];

const video=
document.getElementById("videoPreview");

if(!file){
video.style.display="none";
return;
}

video.src=URL.createObjectURL(file);
video.style.display="block";

}


/* TRANSLATE */

async function translateVideo(){

const file=
document.getElementById("videoFile").files[0];

const original=
document.getElementById("originalLanguage").value;

const target=
document.getElementById("targetLanguage").value;

const status=
document.getElementById("videoStatus");

const button=
document.getElementById("translateButton");

if(!file){

status.textContent=
"❌ আগে একটি ভিডিও Upload করো।";

return;

}

if(original===target){

status.textContent=
"❌ Original Language এবং Translate To একই হতে পারবে না।";

return;

}

button.disabled=true;

status.textContent=
"🤖 AI ভিডিও বিশ্লেষণ করছে...\n\n"+
"👥 Speakers শনাক্ত হচ্ছে...\n"+
"⏱ Dialogue timing বের হচ্ছে...\n"+
"🌐 Translation তৈরি হচ্ছে...";

try{

const buffer=
await file.arrayBuffer();

const bytes=
new Uint8Array(buffer);

let binary="";

const chunkSize=0x8000;

for(
let i=0;
i<bytes.length;
i+=chunkSize
){

binary+=String.fromCharCode(
...bytes.subarray(
i,
Math.min(i+chunkSize,bytes.length)
)
);

}

const videoBase64=btoa(binary);

const response=
await fetch("/api/translate-video",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

videoBase64,
mimeType:file.type,
originalLanguage:original,
targetLanguage:target

})

});

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error||"Translation failed."
);

}

dialogueData=
Array.isArray(data.dialogues)
?data.dialogues
:[];

document.getElementById(
"detectedLanguage"
).innerHTML=
"<b>🔎 Detected Language:</b> "+
escapeHtml(
data.detectedLanguage||"Unknown"
);

renderTimeline();

document.getElementById(
"timelineCard"
).style.display="block";

status.textContent=
"✅ Dialogue analysis complete!";

}catch(error){

status.textContent=
"❌ Error:\n"+
error.message;

}finally{

button.disabled=false;

}

}


/* TIMELINE */

function renderTimeline(){

const container=
document.getElementById(
"dialogueTimeline"
);

container.innerHTML="";

if(!dialogueData.length){

container.innerHTML=
'<div class="empty">'+
'কোনো dialogue পাওয়া যায়নি।'+
'</div>';

return;

}


/*
  প্রথমে speaker অনুযায়ী voice তৈরি করা হচ্ছে।
  একই speakerId আবার এলে একই voice থাকবে।
*/

const speakerVoices={};

let nextVoice=0;

const voices=[
"male1",
"male2",
"youngMale",
"female1",
"female2",
"youngFemale",
"neutral",
"animeMale",
"animeFemale"
];


dialogueData.forEach(item=>{

const id=
item.speakerId||
item.speaker||
"unknown";

if(!speakerVoices[id]){

speakerVoices[id]=
item.voice||
voices[
nextVoice%voices.length
];

nextVoice++;

}

});


dialogueData.forEach(
(item,index)=>{

const speakerId=
item.speakerId||
item.speaker||
"unknown";

const currentVoice=
speakerVoices[speakerId];

const card=
document.createElement("div");

card.className=
"dialogue-card";

card.innerHTML=`

<div class="dialogue-header">

<div class="speaker">
👤 ${escapeHtml(
item.speaker||"Character"
)}
</div>

<div class="time">
⏱ ${escapeHtml(
item.startTime||"00:00"
)}
 →
 ${escapeHtml(
item.endTime||"00:00"
)}
</div>

</div>


<div class="small-grid">

<div class="field">

<label>Start Time</label>

<input
id="start-${index}"
value="${escapeAttr(
item.startTime||"00:00"
)}"
>

</div>


<div class="field">

<label>End Time</label>

<input
id="end-${index}"
value="${escapeAttr(
item.endTime||"00:00"
)}"
>

</div>

</div>


<div class="field">

<label>📝 Original Dialogue</label>

<textarea
id="original-${index}"
>${escapeHtml(
item.transcript||""
)}</textarea>

</div>


<div class="field">

<label>🌐 Translation</label>

<textarea
id="translation-${index}"
>${escapeHtml(
item.translation||""
)}</textarea>

</div>


<div class="voice-box">

<label>🎙️ Character Voice</label>

<select
id="voice-${index}"
onchange="changeVoice(${index})"
>

<option value="male1"
${currentVoice==="male1"?"selected":""}>
👨 Male 1 — Natural
</option>

<option value="male2"
${currentVoice==="male2"?"selected":""}>
👨 Male 2 — Deep
</option>

<option value="youngMale"
${currentVoice==="youngMale"?"selected":""}>
👦 Young Male
</option>

<option value="female1"
${currentVoice==="female1"?"selected":""}>
👩 Female 1 — Natural
</option>

<option value="female2"
${currentVoice==="female2"?"selected":""}>
👩 Female 2 — Soft
</option>

<option value="youngFemale"
${currentVoice==="youngFemale"?"selected":""}>
👧 Young Female
</option>

<option value="neutral"
${currentVoice==="neutral"?"selected":""}>
🧑 Neutral
</option>

<option value="animeMale"
${currentVoice==="animeMale"?"selected":""}>
🎭 Anime Male
</option>

<option value="animeFemale"
${currentVoice==="animeFemale"?"selected":""}>
🎭 Anime Female
</option>

</select>

</div>


<button
class="edit-button"
onclick="previewDialogue(${index})"
>
▶️ Preview Dialogue
</button>


<button
class="save-button"
onclick="saveDialogue(${index})"
>
💾 Save Changes
</button>

`;

container.appendChild(card);

});

}


/* CHANGE VOICE */

function changeVoice(index){

const item=
dialogueData[index];

if(!item)return;

const selected=
document.getElementById(
"voice-"+index
).value;

const speakerId=
item.speakerId||
item.speaker||
"unknown";


/*
  একই Character-এর সব dialogue-এ
  একই voice সেট করা হচ্ছে।
*/

dialogueData.forEach(other=>{

const otherId=
other.speakerId||
other.speaker||
"unknown";

if(otherId===speakerId){

other.voice=selected;

}

});

renderTimeline();

}


/* SAVE */

function saveDialogue(index){

const item=
dialogueData[index];

if(!item)return;

item.startTime=
document.getElementById(
"start-"+index
).value;

item.endTime=
document.getElementById(
"end-"+index
).value;

item.transcript=
document.getElementById(
"original-"+index
).value;

item.translation=
document.getElementById(
"translation-"+index
).value;

item.voice=
document.getElementById(
"voice-"+index
).value;

alert(
"✅ Dialogue "+(index+1)+
" saved."
);

}


/* PREVIEW */

function previewDialogue(index){

const item=
dialogueData[index];

if(!item)return;

const video=
document.getElementById(
"videoPreview"
);

const time=
parseTime(item.startTime);

if(!isNaN(time)){

video.currentTime=time;
video.play();

}

const voice=
document.getElementById(
"voice-"+index
);

const voiceName=
voice.options[
voice.selectedIndex
].text;

alert(
"🎙️ Voice:\n"+
voiceName+
"\n\n"+
"👤 Character:\n"+
(item.speaker||"Character")+
"\n\n"+
"📝 Dialogue:\n"+
(item.translation||"")
);

}


/* TIME */

function parseTime(value){

if(!value)return NaN;

const parts=
value.split(":");

if(parts.length!==2)return NaN;

const minutes=
parseInt(parts[0],10);

const seconds=
parseFloat(parts[1]);

if(
isNaN(minutes)||
isNaN(seconds)
){

return NaN;

}

return minutes*60+seconds;

}


/* SECURITY */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttr(value){

return escapeHtml(value);

}

</script>

</body>
</html>
