<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:850px;
  margin:25px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

input[type="file"]{
  padding:10px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  background:#00b359;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.answer{
  margin-top:18px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:70px;
  white-space:pre-wrap;
}

.status{
  margin-top:15px;
  color:#9ca3af;
  white-space:pre-wrap;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

@media(max-width:600px){
  .language-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 B1S2W AI</h1>
    <p>AI Assistant & Video Language Converter</p>
  </div>


  <!-- AI CHAT -->

  <div class="card">

    <h2>💬 AI Chat</h2>

    <input
      id="question"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="askAI()">
      Send
    </button>

    <div id="answer" class="answer"></div>

  </div>


  <!-- VIDEO LANGUAGE CONVERTER -->

  <div class="card">

    <h2>🎬 Video Language Converter</h2>

    <p style="color:#9ca3af;">
      Upload a video and choose the language you want.
    </p>

    <input
      id="videoFile"
      type="file"
      accept="video/*"
      onchange="previewVideo()"
    >

    <video
      id="videoPreview"
      class="video-preview"
      controls
    ></video>


    <div class="language-grid">

      <div>

        <label>Original Language</label>

        <select id="originalLanguage">

          <option value="auto">
            Auto Detect
          </option>

          <option value="bengali">
            বাংলা
          </option>

          <option value="hindi">
            हिन्दी
          </option>

          <option value="english">
            English
          </option>

        </select>

      </div>


      <div>

        <label>Translate To</label>

        <select id="targetLanguage">

          <option value="bengali">
            বাংলা
          </option>

          <option value="hindi">
            हिन्दी
          </option>

          <option value="english">
            English
          </option>

        </select>

      </div>

    </div>


    <button
      id="translateButton"
      onclick="translateVideo()"
    >
      🌐 Translate Video
    </button>


    <div
      id="videoStatus"
      class="status"
    ></div>


    <h3 style="margin-top:25px;">
      📝 Translation
    </h3>

    <textarea
      id="translation"
      placeholder="Translated text will appear here..."
    ></textarea>

  </div>

</div>


<script>


// ===============================
// AI CHAT
// ===============================

async function askAI(){

  const question =
    document.getElementById("question")
    .value.trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");


  if(!question){

    answer.textContent =
      "Please type a question.";

    return;
  }


  answer.textContent =
    "Thinking... 🤖";

  button.disabled = true;


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          question:question
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Something went wrong."
      );

    }


    answer.textContent =
      "B1S2W AI:\n\n" +
      data.answer;


  }catch(error){

    answer.textContent =
      "B1S2W AI:\n\nError: " +
      error.message;

  }finally{

    button.disabled = false;

  }

}



// ===============================
// VIDEO PREVIEW
// ===============================

function previewVideo(){

  const file =
    document.getElementById(
      "videoFile"
    ).files[0];

  const video =
    document.getElementById(
      "videoPreview"
    );


  if(!file){

    video.style.display =
      "none";

    return;
  }


  const url =
    URL.createObjectURL(file);


  video.src = url;

  video.style.display =
    "block";

}



// ===============================
// VIDEO TRANSLATOR
// ===============================

async function translateVideo(){

  const file =
    document.getElementById(
      "videoFile"
    ).files[0];

  const original =
    document.getElementById(
      "originalLanguage"
    ).value;

  const target =
    document.getElementById(
      "targetLanguage"
    ).value;

  const status =
    document.getElementById(
      "videoStatus"
    );

  const translation =
    document.getElementById(
      "translation"
    );

  const button =
    document.getElementById(
      "translateButton"
    );


  if(!file){

    status.textContent =
      "❌ আগে একটি ভিডিও Upload করো।";

    return;
  }


  if(original === target){

    status.textContent =
      "❌ Original language এবং Target language একই।";

    return;
  }


  button.disabled = true;

  translation.value = "";

  status.textContent =
    "⏳ Video selected.\n\n" +
    "Next step: extracting the speech from the video...";


  try{

    /*
      IMPORTANT:

      এই জায়গায় পরের ধাপে
      Video → Audio → Speech-to-Text
      API যুক্ত করা হবে।

      এখন আমরা test করার জন্য
      একটি sample request পাঠাচ্ছি।
    */


    const question =
      `I want to translate a video.

Original language:
${original}

Target language:
${target}

Please explain the translation workflow and prepare the translated text format.`;



    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          question:question
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Translation request failed."
      );

    }


    translation.value =
      data.answer;


    status.textContent =
      "✅ Translation system connected.\n\n" +
      "⚠️ Actual video speech extraction এখনো connect করা হয়নি।";


  }catch(error){

    status.textContent =
      "❌ Error: " +
      error.message;

  }finally{

    button.disabled = false;

  }

}

</script>

</body>
</html>
