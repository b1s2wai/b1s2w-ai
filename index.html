<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
  text-align:center;
  padding:20px;
}

h1{
  color:#00ff99;
}

.box{
  max-width:500px;
  margin:auto;
}

input{
  width:90%;
  padding:12px;
  font-size:18px;
  border-radius:10px;
  border:none;
  margin-top:20px;
}

button{
  margin-top:15px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
}

#answer{
  margin-top:20px;
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  text-align:left;
}
</style>

</head>

<body>

<div class="box">

<h1>🤖 B1S2W AI</h1>

<p>Ask anything...</p>

<input id="question" placeholder="Type your question">

<br>

<button onclick="askAI()">Send</button>

<div id="answer">
AI reply will appear here...
</div>

</div>



<script>
async function askAI(){

  let question = document.getElementById("question").value;

  if(question.trim() === ""){
    document.getElementById("answer").innerHTML = "প্রশ্ন লিখুন।";
    return;
  }

  document.getElementById("answer").innerHTML = "ভাবছি... 🤖";

  try{

    // এখানে পরে আসল AI কানেকশন যোগ হবে

    setTimeout(function(){
      document.getElementById("answer").innerHTML =
      "B1S2W AI: আপনি লিখেছেন — " + question;
    },1000);

  }
  catch(error){

    document.getElementById("answer").innerHTML =
    "সমস্যা হয়েছে। আবার চেষ্টা করুন।";

  }

}
</script>

}

</body>
</html>
