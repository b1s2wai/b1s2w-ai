<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:850px;
  margin:25px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

input[type="file"]{
  padding:10px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}

.status{
  margin-top:15px;
  color:#9ca3af;
  white-space:pre-wrap;
}

.result{
  margin-top:20px;
  background:#111827;
  padding:15px;
  border-radius:12px;
}

.result textarea{
  margin-top:10px;
}

@media(max-width:600px){
  .language-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🤖 B1S2W AI</h1>
<p>🎬 AI Video Language Converter</p>
</div>

<div class="card">

<h2>🎬 Video Language Converter</h2>

<p style="color:#9ca3af;">
ভিডিও Upload করো এবং যেকোনো ভাষায় অনুবাদ করো।
</p>

<input
id="videoFile"
type="file"
accept="video/*"
onchange="previewVideo()"
>

<video
id="videoPreview"
class="video-preview"
controls
></video>

<div class="language-grid">

<div>

<label>Original Language</label>

<select id="originalLanguage">

<option value="auto">🌐 Auto Detect</option>

<option value="bengali">🇧🇩 বাংলা</option>
<option value="hindi">🇮🇳 हिन्दी</option>
<option value="english">🇺🇸 English</option>
<option value="japanese">🇯🇵 日本語</option>
<option value="korean">🇰🇷 한국어</option>
<option value="chinese">🇨🇳 中文</option>
<option value="spanish">🇪🇸 Español</option>
<option value="french">🇫🇷 Français</option>
<option value="german">🇩🇪 Deutsch</option>
<option value="arabic">🇸🇦 العربية</option>
<option value="portuguese">🇵🇹 Português</option>
<option value="russian">🇷🇺 Русский</option>
<option value="italian">🇮🇹 Italiano</option>
<option value="turkish">🇹🇷 Türkçe</option>
<option value="vietnamese">🇻🇳 Tiếng Việt</option>
<option value="thai">🇹🇭 ไทย</option>
<option value="indonesian">🇮🇩 Bahasa Indonesia</option>
<option value="urdu">🇵🇰 اردو</option>
<option value="tamil">🇮🇳 தமிழ்</option>
<option value="telugu">🇮🇳 తెలుగు</option>
<option value="marathi">🇮🇳 मराठी</option>
<option value="gujarati">🇮🇳 ગુજરાતી</option>
<option value="punjabi">🇮🇳 ਪੰਜਾਬੀ</option>
<option value="malayalam">🇮🇳 മലയാളം</option>
<option value="nepali">🇳🇵 नेपाली</option>

</select>

</div>

<div>

<label>Translate To</label>

<select id="targetLanguage">

<option value="bengali">🇧🇩 বাংলা</option>
<option value="hindi">🇮🇳 हिन्दी</option>
<option value="english">🇺🇸 English</option>
<option value="japanese">🇯🇵 日本語</option>
<option value="korean">🇰🇷 한국어</option>
<option value="chinese">🇨🇳 中文</option>
<option value="spanish">🇪🇸 Español</option>
<option value="french">🇫🇷 Français</option>
<option value="german">🇩🇪 Deutsch</option>
<option value="arabic">🇸🇦 العربية</option>
<option value="portuguese">🇵🇹 Português</option>
<option value="russian">🇷🇺 Русский</option>
<option value="italian">🇮🇹 Italiano</option>
<option value="turkish">🇹🇷 Türkçe</option>
<option value="vietnamese">🇻🇳 Tiếng Việt</option>
<option value="thai">🇹🇭 ไทย</option>
<option value="indonesian">🇮🇩 Bahasa Indonesia</option>
<option value="urdu">🇵🇰 اردو</option>
<option value="tamil">🇮🇳 தமிழ்</option>
<option value="telugu">🇮🇳 తెలుగు</option>
<option value="marathi">🇮🇳 मराठी</option>
<option value="gujarati">🇮🇳 ગુજરાતી</option>
<option value="punjabi">🇮🇳 ਪੰਜਾਬੀ</option>
<option value="malayalam">🇮🇳 മലയാളം</option>
<option value="nepali">🇳🇵 नेपाली</option>

</select>

</div>

</div>

<button
id="translateButton"
onclick="translateVideo()"
>
🌐 Translate Video
</button>

<div id="videoStatus" class="status"></div>

<div id="result" class="result" style="display:none;">

<h3>🔎 Detected Language</h3>

<div id="detectedLanguage"></div>

<h3>📝 Original Transcript</h3>

<textarea
id="transcript"
readonly
></textarea>

<h3>🌐 Translation</h3>

<textarea
id="translation"
readonly
></textarea>

</div>

</div>

</div>


<script>

function previewVideo(){

const file =
document.getElementById("videoFile").files[0];

const video =
document.getElementById("videoPreview");

if(!file){

video.style.display="none";
return;

}

const url =
URL.createObjectURL(file);

video.src=url;

video.style.display="block";

}


async function translateVideo(){

const file =
document.getElementById("videoFile").files[0];

const original =
document.getElementById("originalLanguage").value;

const target =
document.getElementById("targetLanguage").value;

const status =
document.getElementById("videoStatus");

const button =
document.getElementById("translateButton");

const result =
document.getElementById("result");

const detected =
document.getElementById("detectedLanguage");

const transcript =
document.getElementById("transcript");

const translation =
document.getElementById("translation");


if(!file){

status.textContent =
"❌ আগে একটি ভিডিও Upload করো।";

return;

}


if(original === target){

status.textContent =
"❌ Original Language এবং Translate To একই হতে পারবে না।";

return;

}


button.disabled=true;

result.style.display="none";

status.textContent =
"⏳ Video AI-তে পাঠানো হচ্ছে...\n\nএতে কিছু সময় লাগতে পারে।";


try{

const arrayBuffer =
await file.arrayBuffer();

const bytes =
new Uint8Array(arrayBuffer);

let binary="";

const chunkSize=0x8000;

for(
let i=0;
i<bytes.length;
i+=chunkSize
){

binary += String.fromCharCode(
...bytes.subarray(
i,
Math.min(i+chunkSize,bytes.length)
)
);

}

const videoBase64 =
btoa(binary);


status.textContent =
"🤖 AI ভিডিও বিশ্লেষণ করছে...\n\n" +
"🎧 Speech শনাক্ত করা হচ্ছে...\n" +
"🌐 Translation তৈরি হচ্ছে...";


const response =
await fetch("/api/translate-video",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

videoBase64:videoBase64,

mimeType:file.type,

originalLanguage:original,

targetLanguage:target

})

});


const data =
await response.json();


if(!response.ok){

throw new Error(
typeof data.error === "string"
? data.error
: JSON.stringify(data.error)
);

}


detected.textContent =
data.detectedLanguage || "Unknown";


transcript.value =
data.transcript || "";


translation.value =
data.translation || "";


result.style.display="block";


status.textContent =
"✅ Video translation complete!";


}catch(error){

status.textContent =
"❌ Error:\n" +
error.message;

}finally{

button.disabled=false;

}

}

</script>

</body>
  </html>
