<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:850px;
  margin:30px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  background:#00b359;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.answer,
.video-result{
  margin-top:18px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:70px;
  white-space:pre-wrap;
  word-break:break-word;
}

.video-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.status{
  margin-top:15px;
  color:#9ca3af;
  white-space:pre-wrap;
}

.copy-button{
  background:#2563eb;
}

.copy-button:hover{
  background:#1d4ed8;
}

@media(max-width:600px){
  .video-options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 B1S2W AI</h1>
    <p>AI Assistant & Video Prompt Creator</p>
  </div>


  <!-- AI CHAT -->

  <div class="card">

    <h2>💬 AI Chat</h2>

    <input
      id="question"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="askAI()">
      Send
    </button>

    <div
      id="answer"
      class="answer">
    </div>

  </div>


  <!-- VIDEO PROMPT CREATOR -->

  <div class="card">

    <h2>🎬 Video Generator</h2>

    <textarea
      id="videoPrompt"
      placeholder="Describe the video you want to create..."
    ></textarea>


    <div class="video-options">

      <div>

        <label>Video Style</label>

        <select id="videoStyle">

          <option>Anime</option>
          <option>Cinematic</option>
          <option>Realistic</option>
          <option>3D Animation</option>
          <option>Cartoon</option>

        </select>

      </div>


      <div>

        <label>Duration</label>

        <select id="videoDuration">

          <option>5 seconds</option>
          <option>10 seconds</option>
          <option>15 seconds</option>
          <option>30 seconds</option>

        </select>

      </div>

    </div>


    <button onclick="generateVideoPrompt()">
      ✨ Create Video Prompt
    </button>


    <div
      id="videoStatus"
      class="status">
    </div>


    <div
      id="videoResult"
      class="video-result">
    </div>


    <button
      id="copyButton"
      class="copy-button"
      onclick="copyVideoPrompt()"
      style="display:none;">

      📋 Copy Prompt

    </button>

  </div>

</div>


<script>


/* =========================
   AI CHAT
========================= */

async function askAI(){

  const question =
    document
      .getElementById("question")
      .value
      .trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");


  if(!question){

    answer.textContent =
      "Please type a question.";

    return;
  }


  answer.textContent =
    "Thinking... 🤖";

  button.disabled = true;


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          question:question
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Something went wrong."
      );

    }


    answer.textContent =
      "B1S2W AI:\n\n" +
      data.answer;


  }catch(error){

    answer.textContent =
      "B1S2W AI:\n\nError: " +
      error.message;

  }finally{

    button.disabled = false;

  }

}



/* =========================
   VIDEO PROMPT CREATOR
========================= */

function generateVideoPrompt(){

  const prompt =
    document
      .getElementById("videoPrompt")
      .value
      .trim();


  const style =
    document
      .getElementById("videoStyle")
      .value;


  const duration =
    document
      .getElementById("videoDuration")
      .value;


  const status =
    document
      .getElementById("videoStatus");


  const result =
    document
      .getElementById("videoResult");


  const copyButton =
    document
      .getElementById("copyButton");


  if(!prompt){

    status.textContent =
      "⚠️ Please describe the video first.";

    result.textContent = "";

    copyButton.style.display =
      "none";

    return;

  }


  status.textContent =
    "✨ Creating your video prompt...";


  const finalPrompt =

`Create a ${duration} high-quality ${style} video.

SUBJECT:
${prompt}

VISUAL STYLE:
High-quality cinematic ${style} animation, detailed environment, expressive characters, natural movement, consistent character appearance, beautiful lighting, rich atmosphere and professional visual composition.

CAMERA:
Smooth cinematic camera movement, natural tracking, stable framing, realistic depth and subtle parallax.

ANIMATION:
Fluid motion, natural body movement, realistic hair and clothing movement, consistent lighting and character proportions.

LIGHTING:
Cinematic lighting with detailed shadows, atmospheric depth and visually appealing highlights.

MOOD:
Immersive, emotional and cinematic.

QUALITY:
High detail, clean animation, smooth motion, professional composition, no random text, no watermark, no distorted faces, no extra limbs.`;


  result.textContent =
    finalPrompt;


  copyButton.style.display =
    "block";


  status.textContent =
    "✅ Video prompt ready!";


}



/* =========================
   COPY VIDEO PROMPT
========================= */

async function copyVideoPrompt(){

  const result =
    document
      .getElementById("videoResult");


  const text =
    result.textContent;


  if(!text){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );


    document
      .getElementById("videoStatus")
      .textContent =
      "✅ Prompt copied!";

  }catch(error){

    document
      .getElementById("videoStatus")
      .textContent =
      "⚠️ Copy failed. Please copy the prompt manually.";

  }

}

</script>

</body>
</html>
