<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:850px;
  margin:25px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
  font-size:32px;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

input[type="file"]{
  padding:10px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  background:#00b359;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.answer,
.result-box{
  margin-top:18px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:70px;
  white-space:pre-wrap;
}

.status{
  margin-top:15px;
  color:#9ca3af;
  white-space:pre-wrap;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
  max-height:450px;
  background:#000;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}

.result-title{
  color:#00ff99;
  margin-bottom:8px;
}

.small{
  color:#9ca3af;
  font-size:13px;
  margin-top:8px;
}

@media(max-width:600px){
  .language-grid{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">
    <h1>🤖 B1S2W AI</h1>
    <p>AI Assistant & Video Language Converter</p>
  </div>


  <!-- AI CHAT -->

  <div class="card">

    <h2>💬 AI Chat</h2>

    <input
      id="question"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="askAI()"
    >
      Send
    </button>

    <div
      id="answer"
      class="answer"
    ></div>

  </div>


  <!-- VIDEO TRANSLATOR -->

  <div class="card">

    <h2>🎬 Video Language Converter</h2>

    <p style="color:#9ca3af;">
      Upload a video and translate the spoken dialogue.
    </p>

    <input
      id="videoFile"
      type="file"
      accept="video/*"
      onchange="previewVideo()"
    >

    <div class="small">
      ছোট ভিডিও দিয়ে প্রথমে পরীক্ষা করো।
    </div>

    <video
      id="videoPreview"
      class="video-preview"
      controls
    ></video>


    <!-- LANGUAGES -->

    <div class="language-grid">

      <div>

        <label>Original Language</label>

        <select id="originalLanguage">

          <option value="auto">
            Auto Detect
          </option>

          <option value="Bengali">
            বাংলা
          </option>

          <option value="Hindi">
            हिन्दी
          </option>

          <option value="English">
            English
          </option>

        </select>

      </div>


      <div>

        <label>Translate To</label>

        <select id="targetLanguage">

          <option value="Bengali">
            বাংলা
          </option>

          <option value="Hindi">
            हिन्दी
          </option>

          <option value="English">
            English
          </option>

        </select>

      </div>

    </div>


    <button
      id="translateButton"
      onclick="translateVideo()"
    >
      🌐 Translate Video
    </button>


    <div
      id="videoStatus"
      class="status"
    ></div>


    <!-- DETECTED LANGUAGE -->

    <div
      id="detectedBox"
      class="result-box"
      style="display:none;"
    >
      <div class="result-title">
        🔎 Detected Language
      </div>

      <div id="detectedLanguage"></div>
    </div>


    <!-- TRANSCRIPT -->

    <div
      id="transcriptBox"
      class="result-box"
      style="display:none;"
    >

      <div class="result-title">
        📝 Original Transcript
      </div>

      <div id="transcript"></div>

    </div>


    <!-- TRANSLATION -->

    <div
      id="translationBox"
      class="result-box"
      style="display:none;"
    >

      <div class="result-title">
        🌐 Translation
      </div>

      <div id="translation"></div>

    </div>

  </div>

</div>


<script>


// =====================================
// AI CHAT
// =====================================

async function askAI(){

  const question =
    document.getElementById("question")
    .value.trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");


  if(!question){

    answer.textContent =
      "Please type a question.";

    return;
  }


  answer.textContent =
    "Thinking... 🤖";

  button.disabled = true;


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          question:question
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Something went wrong."
      );

    }


    answer.textContent =
      "B1S2W AI:\n\n" +
      data.answer;


  }catch(error){

    answer.textContent =
      "B1S2W AI:\n\nError: " +
      error.message;

  }finally{

    button.disabled = false;

  }

}



// =====================================
// VIDEO PREVIEW
// =====================================

function previewVideo(){

  const file =
    document.getElementById(
      "videoFile"
    ).files[0];

  const video =
    document.getElementById(
      "videoPreview"
    );


  if(!file){

    video.style.display =
      "none";

    return;
  }


  const url =
    URL.createObjectURL(file);


  video.src = url;

  video.style.display =
    "block";

}



// =====================================
// VIDEO TO BASE64
// =====================================

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = () => {

        const result =
          reader.result;

        const base64 =
          result.split(",")[1];

        resolve(base64);

      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}



// =====================================
// VIDEO TRANSLATOR
// =====================================

async function translateVideo(){

  const file =
    document.getElementById(
      "videoFile"
    ).files[0];

  const original =
    document.getElementById(
      "originalLanguage"
    ).value;

  const target =
    document.getElementById(
      "targetLanguage"
    ).value;

  const status =
    document.getElementById(
      "videoStatus"
    );

  const button =
    document.getElementById(
      "translateButton"
    );

  const detectedBox =
    document.getElementById(
      "detectedBox"
    );

  const transcriptBox =
    document.getElementById(
      "transcriptBox"
    );

  const translationBox =
    document.getElementById(
      "translationBox"
    );


  // Hide old results

  detectedBox.style.display =
    "none";

  transcriptBox.style.display =
    "none";

  translationBox.style.display =
    "none";


  // Check video

  if(!file){

    status.textContent =
      "❌ আগে একটি ভিডিও Upload করো।";

    return;
  }


  // Prevent same language

  if(
    original !== "auto" &&
    original === target
  ){

    status.textContent =
      "❌ Original language এবং Target language একই।";

    return;
  }


  // Small-video test limit

  const maxSize =
    10 * 1024 * 1024;

  if(file.size > maxSize){

    status.textContent =
      "❌ ভিডিওটি অনেক বড়। প্রথমে 10 MB-এর কম একটি ভিডিও দিয়ে test করো।";

    return;
  }


  button.disabled = true;


  status.textContent =
    "⏳ Video reading হচ্ছে...\n\n" +
    "তারপর AI ভিডিওর spoken dialogue বিশ্লেষণ করবে।";


  try{

    // Convert video to Base64

    const videoBase64 =
      await fileToBase64(file);


    status.textContent =
      "⏳ Video AI-তে পাঠানো হচ্ছে...\n\n" +
      "এতে কিছু সময় লাগতে পারে।";


    // Send to backend

    const response =
      await fetch(
        "/api/translate-video",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            videoBase64:
              videoBase64,

            mimeType:
              file.type,

            originalLanguage:
              original,

            targetLanguage:
              target

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Video translation failed."
      );

    }


    // Detected language

    document.getElementById(
      "detectedLanguage"
    ).textContent =
      data.detectedLanguage ||
      "Unknown";


    detectedBox.style.display =
      "block";


    // Original transcript

    document.getElementById(
      "transcript"
    ).textContent =
      data.transcript ||
      "No speech detected.";


    transcriptBox.style.display =
      "block";


    // Translation

    document.getElementById(
      "translation"
    ).textContent =
      data.translation ||
      "No translation returned.";


    translationBox.style.display =
      "block";


    status.textContent =
      "✅ Video translation complete!";


  }catch(error){

    status.textContent =
      "❌ Error:\n" +
      error.message;

  }finally{

    button.disabled = false;

  }

}

</script>

</body>
      </html>
