<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:#fff;
}

.container{
  width:92%;
  max-width:850px;
  margin:30px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  background:#00b359;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.answer{
  margin-top:18px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:70px;
  white-space:pre-wrap;
}

.video-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.status{
  margin-top:15px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  color:#d1d5db;
  white-space:pre-wrap;
}

@media(max-width:600px){
  .video-options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 B1S2W AI</h1>
    <p>AI Assistant & Video Creator</p>
  </div>

  <!-- AI CHAT -->
  <div class="card">

    <h2>💬 AI Chat</h2>

    <input
      id="question"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="askAI()">
      Send
    </button>

    <div id="answer" class="answer"></div>

  </div>


  <!-- VIDEO GENERATOR -->
  <div class="card">

    <h2>🎬 Video Generator</h2>

    <textarea
      id="videoPrompt"
      placeholder="Describe the video you want to create..."
    ></textarea>

    <div class="video-options">

      <div>
        <label>Video Style</label>

        <select id="videoStyle">
          <option>Anime</option>
          <option>Cinematic</option>
          <option>Realistic</option>
          <option>3D Animation</option>
          <option>Cartoon</option>
        </select>
      </div>

      <div>
        <label>Duration</label>

        <select id="videoDuration">
          <option>5 seconds</option>
          <option>10 seconds</option>
          <option>15 seconds</option>
          <option>30 seconds</option>
        </select>
      </div>

    </div>

    <button id="videoButton" onclick="generateVideo()">
      🎥 Generate Video Prompt
    </button>

    <div id="videoStatus" class="status"></div>

  </div>

</div>


<script>

async function askAI(){

  const question =
    document.getElementById("question").value.trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");

  if(!question){
    answer.textContent = "Please type a question.";
    return;
  }

  answer.textContent = "Thinking... 🤖";
  button.disabled = true;

  try{

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question:question
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "Something went wrong."
      );
    }

    answer.textContent =
      "B1S2W AI:\n\n" + data.answer;

  }catch(error){

    answer.textContent =
      "B1S2W AI:\n\nError: " + error.message;

  }finally{

    button.disabled = false;

  }
}


async function generateVideo(){

  const prompt =
    document.getElementById("videoPrompt").value.trim();

  const style =
    document.getElementById("videoStyle").value;

  const duration =
    document.getElementById("videoDuration").value;

  const status =
    document.getElementById("videoStatus");

  const button =
    document.getElementById("videoButton");

  if(!prompt){

    status.textContent =
      "Please describe the video first.";

    return;
  }

  button.disabled = true;

  status.textContent =
    "🤖 B1S2W AI is creating your video prompt...";

  try{

    const response = await fetch("/api/video-prompt",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prompt:prompt,
        style:style,
        duration:duration
      })
    });

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Video prompt generation failed."
      );

    }

    status.textContent =
      "🎬 Video Prompt Ready!\n\n" +
      data.videoPrompt;

  }catch(error){

    status.textContent =
      "❌ Error: " + error.message;

  }finally{

    button.disabled = false;

  }

}

</script>

</body>
</html>
