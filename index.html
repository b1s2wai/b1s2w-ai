<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B1S2W AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1120;
  color:white;
}

.container{
  width:92%;
  max-width:900px;
  margin:25px auto;
}

.header{
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  color:#00ff99;
}

.header p{
  color:#9ca3af;
}

.card{
  background:#1f2937;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#111827;
  color:white;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.video-preview{
  width:100%;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}

.status{
  margin-top:15px;
  color:#9ca3af;
  white-space:pre-wrap;
}

.timeline{
  margin-top:20px;
}

.dialogue-card{
  background:#0f172a;
  border:1px solid #374151;
  border-radius:14px;
  padding:16px;
  margin-top:15px;
}

.dialogue-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.speaker{
  color:#00ff99;
  font-size:18px;
  font-weight:bold;
}

.time{
  color:#fbbf24;
  font-size:14px;
}

.small-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:10px;
}

.small-grid label,
.voice-row label{
  color:#9ca3af;
  font-size:13px;
}

.voice-row{
  margin-top:12px;
}

.edit-button{
  background:#2563eb;
}

.save-button{
  background:#9333ea;
}

.empty{
  color:#9ca3af;
  text-align:center;
  padding:20px;
}

@media(max-width:600px){
  .language-grid,
  .small-grid{
    grid-template-columns:1fr;
  }

  .dialogue-header{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🤖 B1S2W AI</h1>
<p>🎬 AI Video Language Converter & Dialogue Timeline</p>
</div>

<div class="card">

<h2>🎬 Video Language Converter</h2>

<p style="color:#9ca3af;">
ভিডিও Upload করো এবং dialogue আলাদা করে translation তৈরি করো।
</p>

<input
id="videoFile"
type="file"
accept="video/*"
onchange="previewVideo()"
>

<video
id="videoPreview"
class="video-preview"
controls
></video>

<div class="language-grid">

<div>

<label>Original Language</label>

<select id="originalLanguage">

<option value="auto">🌐 Auto Detect</option>
<option value="bengali">🇧🇩 বাংলা</option>
<option value="hindi">🇮🇳 हिन्दी</option>
<option value="english">🇺🇸 English</option>
<option value="japanese">🇯🇵 日本語</option>
<option value="korean">🇰🇷 한국어</option>
<option value="chinese">🇨🇳 中文</option>

</select>

</div>

<div>

<label>Translate To</label>

<select id="targetLanguage">

<option value="bengali">🇧🇩 বাংলা</option>
<option value="hindi">🇮🇳 हिन्दी</option>
<option value="english">🇺🇸 English</option>
<option value="japanese">🇯🇵 日本語</option>
<option value="korean">🇰🇷 한국어</option>
<option value="chinese">🇨🇳 中文</option>

</select>

</div>

</div>

<button
id="translateButton"
onclick="translateVideo()"
>
🌐 Analyze & Translate Video
</button>

<div id="videoStatus" class="status"></div>

</div>

<div
id="timelineCard"
class="card"
style="display:none;"
>

<h2>🎬 Dialogue Timeline</h2>

<p style="color:#9ca3af;">
প্রতিটি Character-এর dialogue, timing এবং voice আলাদাভাবে edit করতে পারবে।
</p>

<div id="detectedLanguage"></div>

<div
id="dialogueTimeline"
class="timeline"
></div>

</div>

</div>

<script>

let dialogueData = [];


/* =========================
   VIDEO PREVIEW
========================= */

function previewVideo(){

const file =
document.getElementById("videoFile").files[0];

const video =
document.getElementById("videoPreview");

if(!file){

video.style.display="none";
return;

}

video.src =
URL.createObjectURL(file);

video.style.display="block";

}


/* =========================
   TRANSLATE VIDEO
========================= */

async function translateVideo(){

const file =
document.getElementById("videoFile").files[0];

const original =
document.getElementById("originalLanguage").value;

const target =
document.getElementById("targetLanguage").value;

const status =
document.getElementById("videoStatus");

const button =
document.getElementById("translateButton");

const timelineCard =
document.getElementById("timelineCard");


if(!file){

status.textContent =
"❌ আগে একটি ভিডিও Upload করো।";

return;

}


if(original === target){

status.textContent =
"❌ Original Language এবং Translate To একই হতে পারবে না।";

return;

}


button.disabled=true;

timelineCard.style.display="none";

status.textContent =
"⏳ Video AI-তে পাঠানো হচ্ছে...";


try{

const arrayBuffer =
await file.arrayBuffer();

const bytes =
new Uint8Array(arrayBuffer);

let binary="";

const chunkSize=0x8000;

for(
let i=0;
i<bytes.length;
i+=chunkSize
){

binary += String.fromCharCode(
...bytes.subarray(
i,
Math.min(
i+chunkSize,
bytes.length
)
)
);

}

const videoBase64 =
btoa(binary);


status.textContent =
"🤖 AI ভিডিও বিশ্লেষণ করছে...\n\n"+
"👥 Speakers শনাক্ত করা হচ্ছে...\n"+
"⏱ Dialogue timing বের করা হচ্ছে...\n"+
"🌐 Translation তৈরি হচ্ছে...";


const response =
await fetch(
"/api/translate-video",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

videoBase64,

mimeType:file.type,

originalLanguage:original,

targetLanguage:target

})

});


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Translation failed."
);

}


dialogueData =
Array.isArray(data.dialogues)
? data.dialogues
: [];


document.getElementById(
"detectedLanguage"
).innerHTML =
"<b>🔎 Detected Language:</b> "+
escapeHtml(
data.detectedLanguage ||
"Unknown"
);


renderTimeline();


timelineCard.style.display="block";


status.textContent =
"✅ Dialogue analysis complete!";


}catch(error){

status.textContent =
"❌ Error:\n"+
error.message;

}finally{

button.disabled=false;

}

}


/* =========================
   VOICE LIST
========================= */

function getVoiceOptions(selectedVoice){

const voices = [

{
id:"voice1",
name:"👨 Male 1 — Natural"
},

{
id:"voice2",
name:"👩 Female 1 — Natural"
},

{
id:"voice3",
name:"👨 Male 2 — Deep"
},

{
id:"voice4",
name:"👩 Female 2 — Soft"
},

{
id:"voice5",
name:"👨 Male 3 — Young"
},

{
id:"voice6",
name:"👩 Female 3 — Young"
},

{
id:"voice7",
name:"👨 Male 4 — Anime"
},

{
id:"voice8",
name:"👩 Female 4 — Anime"
},

{
id:"voice9",
name:"🎙️ Neutral"
}

];


return voices.map(
voice => `

<option
value="${voice.id}"
${voice.id === selectedVoice ? "selected" : ""}
>
${voice.name}
</option>

`
).join("");

}


/* =========================
   RENDER TIMELINE
========================= */

function renderTimeline(){

const container =
document.getElementById(
"dialogueTimeline"
);

container.innerHTML="";


if(!dialogueData.length){

container.innerHTML =
'<div class="empty">'+
'কোনো dialogue পাওয়া যায়নি।'+
'</div>';

return;

}


dialogueData.forEach(
(item,index)=>{


/*
 * Character number বের করা
 */

const characterNumber =
getCharacterNumber(item,index);


/*
 * Backend voice না দিলে
 * Character number অনুযায়ী voice।
 */

const defaultVoice =
item.voice ||
`voice${characterNumber}`;


/*
 * একই Character-এর voice
 * সব dialogue-এ একই থাকবে।
 */

item.voice =
defaultVoice;


const card =
document.createElement("div");

card.className =
"dialogue-card";


card.innerHTML = `

<div class="dialogue-header">

<div class="speaker">

👤 Character ${characterNumber}

</div>

<div class="time">

⏱ ${escapeHtml(
item.startTime ||
"00:00.00"
)}

→

${escapeHtml(
item.endTime ||
"00:00.00"
)}

</div>

</div>


<div class="small-grid">

<div>

<label>Start Time</label>

<input
id="start-${index}"
value="${escapeAttr(
item.startTime ||
"00:00.00"
)}"
>

</div>


<div>

<label>End Time</label>

<input
id="end-${index}"
value="${escapeAttr(
item.endTime ||
"00:00.00"
)}"
>

</div>

</div>


<div>

<label>📝 Original Dialogue</label>

<textarea
id="original-${index}"
>${escapeHtml(
item.transcript ||
""
)}</textarea>

</div>


<div>

<label>🌐 Translation</label>

<textarea
id="translation-${index}"
>${escapeHtml(
item.translation ||
""
)}</textarea>

</div>


<div class="voice-row">

<label>
🎙️ Character Voice
</label>

<select id="voice-${index}">

${getVoiceOptions(
defaultVoice
)}

</select>

</div>


<button
class="edit-button"
onclick="previewDialogue(${index})"
>
▶️ Preview Dialogue
</button>


<button
class="save-button"
onclick="saveDialogue(${index})"
>
💾 Save Changes
</button>

`;


container.appendChild(card);

});

}


/* =========================
   CHARACTER NUMBER
========================= */

function getCharacterNumber(item,index){

const speakerId =
String(
item.speakerId ||
""
);


const idMatch =
speakerId.match(
/(?:speaker[_ -]?)(\d+)/i
);


if(idMatch){

const number =
parseInt(
idMatch[1],
10
);

if(
Number.isInteger(number) &&
number>0
){

return number;

}

}


const speaker =
String(
item.speaker ||
""
);


const speakerMatch =
speaker.match(
/(?:character|speaker)[ _-]?(\d+)/i
);


if(speakerMatch){

const number =
parseInt(
speakerMatch[1],
10
);

if(
Number.isInteger(number) &&
number>0
){

return number;

}

}


return index+1;

}


/* =========================
   SAVE DIALOGUE
========================= */

function saveDialogue(index){

const item =
dialogueData[index];

if(!item){
return;
}


item.startTime =
document.getElementById(
"start-"+index
).value;


item.endTime =
document.getElementById(
"end-"+index
).value;


item.transcript =
document.getElementById(
"original-"+index
).value;


item.translation =
document.getElementById(
"translation-"+index
).value;


item.voice =
document.getElementById(
"voice-"+index
).value;


/*
 * Save করার পর
 * একই Character-এর voice
 * পরের dialogue-তেও থাকবে।
 */

const characterNumber =
getCharacterNumber(
item,
index
);


dialogueData.forEach(
(otherItem,otherIndex)=>{

if(
getCharacterNumber(
otherItem,
otherIndex
) === characterNumber
){

otherItem.voice =
item.voice;

}

});


renderTimeline();


alert(
"✅ Character "+characterNumber+
" dialogue saved."
);

}


/* =========================
   PREVIEW DIALOGUE
========================= */

function previewDialogue(index){

const item =
dialogueData[index];

if(!item){
return;
}


const video =
document.getElementById(
"videoPreview"
);


const time =
parseTime(
item.startTime
);


if(!isNaN(time)){

video.currentTime =
time;

video.play();

}


alert(
"🎙️ Voice: "+
getVoiceName(item.voice)+
"\n\n"+
"Dialogue:\n"+
item.translation
);

}


/* =========================
   VOICE NAME
========================= */

function getVoiceName(voice){

const names = {

voice1:"👨 Male 1 — Natural",

voice2:"👩 Female 1 — Natural",

voice3:"👨 Male 2 — Deep",

voice4:"👩 Female 2 — Soft",

voice5:"👨 Male 3 — Young",

voice6:"👩 Female 3 — Young",

voice7:"👨 Male 4 — Anime",

voice8:"👩 Female 4 — Anime",

voice9:"🎙️ Neutral"

};

return names[voice] || voice;

}


/* =========================
   TIME
========================= */

function parseTime(value){

if(!value){
return NaN;
}


const parts =
value.split(":");


if(parts.length!==2){
return NaN;
}


const minutes =
parseInt(
parts[0],
10
);


const seconds =
parseFloat(
parts[1]
);


if(
isNaN(minutes) ||
isNaN(seconds)
){

return NaN;

}


return (
minutes*60+
seconds
);

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return escapeHtml(value);

}

</script>

</body>
  </html>
