<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1S2W AI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:700px;
  background:#1f2937;
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
  text-align:center;
  color:#00ff99;
}

input{
  box-sizing:border-box;
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  font-size:18px;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#answer{
  margin-top:20px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:80px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 B1S2W AI</h1>

<input
  id="question"
  type="text"
  placeholder="Ask me anything..."
  autocomplete="off"
>

<button id="sendButton" onclick="askAI()">Send</button>

<div id="answer"></div>

</div>

<script>

async function askAI(){

  const question =
    document.getElementById("question").value.trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");

  if(!question){
    answer.textContent = "Please type a question.";
    return;
  }

  answer.textContent = "Thinking... 🤖";
  button.disabled = true;

  try{

    const response = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },

      body: JSON.stringify({
        question: question
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        "Server returned non-JSON response: " +
        text.substring(0,200)
      );
    }

    if(!response.ok){
      throw new Error(
        data.error || "Something went wrong."
      );
    }

    answer.textContent =
      "B1S2W AI:\n\n" +
      (data.answer || "No answer received.");

  }catch(error){

    answer.textContent =
      "B1S2W AI:\n\nError: " +
      error.message;

  }finally{

    button.disabled = false;

  }
}

</script>

</body>
</html>
