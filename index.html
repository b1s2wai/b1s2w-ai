<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1S2W AI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:90%;
  max-width:700px;
  background:#1f2937;
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
  text-align:center;
  color:#00ff99;
}

input{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  font-size:18px;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00cc66;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#00aa55;
}

#answer{
  margin-top:20px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  min-height:80px;
}
</style>
</head>

<body>

<div class="container">
<h1>🤖 B1S2W AI</h1>

<input
id="question"
type="text"
placeholder="Ask me anything...">

<button onclick="askAI()">Send</button>

<div id="answer"></div>

  <script>

async function askAI(){

  const question = document.getElementById("question").value;

  if(question.trim()===""){
    document.getElementById("answer").innerHTML="Please type a question.";
    return;
  }

  document.getElementById("answer").innerHTML="Thinking... 🤖";

  // আপাতত টেস্ট রিপ্লাই
  setTimeout(function(){

    document.getElementById("answer").innerHTML =
    "<b>B1S2W AI:</b><br>" +
    "আপনি লিখেছেন: <b>" + question + "</b>";

  },1000);

}

</script>

</div>

</body>
</html>
